name: Daily radar and GitHub Pages
run-name: Daily radar · ${{ inputs.phase || 'publish' }}${{ inputs.target_date && format(' · replay {0}', inputs.target_date) || '' }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Pre-screen news, or finish and publish the daily digest
        required: true
        default: publish
        type: choice
        options:
          - publish
          - news
      force:
        description: Run again even when today's digest was already delivered
        required: false
        default: false
        type: boolean
      rerun_budget:
        description: Allow this forced run a 700k Token / USD 1.50 daily ceiling
        required: false
        default: false
        type: boolean
      target_date:
        description: Past Shanghai digest date YYYY-MM-DD (requires force and publish)
        required: false
        default: ""
        type: string
  schedule:
    # arXiv announces at 20:00 US Eastern: 08:00 Shanghai in daylight-saving
    # time and 09:00 in standard time. These are native GitHub fallbacks;
    # Alibaba Function Compute supplies the punctual primary triggers.
    - cron: "10 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "50 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "10 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "30 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: github-pages
  # A backup trigger must queue behind, rather than cancel, an active delivery.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_run: ${{ steps.daily-guard.outputs.should_run }}
      phase: ${{ steps.execution-phase.outputs.value }}
      local_date: ${{ steps.usage-date.outputs.digest_date }}
      success_marker_exists: ${{ steps.daily-success.outputs.cache-hit }}
    steps:
      - name: Resolve execution phase
        id: execution-phase
        shell: bash
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
        run: |
          if [ "$REQUESTED_PHASE" = "news" ]; then
            echo "value=news" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Shanghai usage date
        id: usage-date
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          FORCE_RUN: ${{ inputs.force }}
          PHASE: ${{ steps.execution-phase.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          target = os.environ.get("TARGET_DATE", "")
          if target:
              parsed = date.fromisoformat(target)
              if parsed.isoformat() != target or parsed >= today:
                  raise SystemExit("target_date must be a past YYYY-MM-DD Shanghai date")
              if os.environ["EVENT_NAME"] != "workflow_dispatch" or os.environ["FORCE_RUN"] != "true" or os.environ["PHASE"] != "publish":
                  raise SystemExit("Dated replay requires a forced manual publish")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"value={today.isoformat()}\ndigest_date={target or today.isoformat()}\ntarget_date={target}\n")
          PY

      - name: Restore today's successful-delivery marker
        id: daily-success
        uses: actions/cache/restore@v5
        with:
          path: .daily-success
          key: daily-radar-success-${{ runner.os }}-${{ steps.usage-date.outputs.digest_date }}

      - name: Skip backup attempts after today's first success
        id: daily-guard
        shell: bash
        env:
          FORCE_RUN: ${{ inputs.force }}
          SUCCESS_CACHE_HIT: ${{ steps.daily-success.outputs.cache-hit }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual force run requested; ignoring today's success marker."
          elif [ "$SUCCESS_CACHE_HIT" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today's digest was already delivered; this backup attempt is a no-op."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No successful delivery exists for today; continuing."
          fi

      - name: Check out repository
        if: steps.daily-guard.outputs.should_run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.daily-guard.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        if: steps.daily-guard.outputs.should_run == 'true'
        run: python -m pip install -e .

      - name: Run offline tests
        if: steps.daily-guard.outputs.should_run == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --test aliyun-fc/test/*.test.js

      - name: Require an arXiv contact address
        if: steps.daily-guard.outputs.should_run == 'true'
        env:
          RADAR_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
        run: |
          if [ -z "$RADAR_CONTACT_EMAIL" ]; then
            echo "::error::Create the repository variable ARXIV_CONTACT_EMAIL before running this workflow."
            exit 1
          fi

      - name: Require DeepSeek API secret
        if: steps.daily-guard.outputs.should_run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Create the Actions secret DEEPSEEK_API_KEY before running this workflow."
            exit 1
          fi

      - name: Restore same-day radar state
        if: steps.daily-guard.outputs.should_run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: data/daily_radar.db
          key: >-
            daily-radar-state-${{ runner.os }}-${{ steps.usage-date.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-radar-state-${{ runner.os }}-${{ steps.usage-date.outputs.value }}-${{ github.run_id }}-
            daily-radar-state-${{ runner.os }}-${{ steps.usage-date.outputs.value }}-
            daily-radar-state-${{ runner.os }}-${{ steps.usage-date.outputs.digest_date }}-

      - name: Configure GitHub Pages
        if: steps.daily-guard.outputs.should_run == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore today's published DeepSeek usage
        if: steps.daily-guard.outputs.should_run == 'true'
        run: >-
          daily-radar restore-usage
          --url "${{ steps.pages.outputs.base_url }}/data/latest.json"

      - name: Preserve published historical archives
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          TARGET_DATE: ${{ steps.usage-date.outputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            daily-radar restore-site --url "$SITE_URL/" --output site --include-root
          else
            daily-radar restore-site --url "$SITE_URL/" --output site
          fi

      - name: Apply approved one-run budget override
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.force && inputs.rerun_budget
        run: |
          echo "DAILY_RADAR_LLM_DAILY_TOKEN_LIMIT=700000" >> "$GITHUB_ENV"
          echo "DAILY_RADAR_LLM_DAILY_COST_LIMIT_USD=1.50" >> "$GITHUB_ENV"
          echo "Manual rerun only: daily ceiling is 700k Token / USD 1.50; prior usage remains counted."

      - name: Pre-screen verified news
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'news'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DAILY_RADAR_USER_AGENT: "DailyAIRadar/${{ github.repository }} (contact: ${{ vars.ARXIV_CONTACT_EMAIL }})"
        run: daily-radar collect --kind news

      - name: Collect papers and finalize digest
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DAILY_RADAR_USER_AGENT: "DailyAIRadar/${{ github.repository }} (contact: ${{ vars.ARXIV_CONTACT_EMAIL }})"
          FORCE_RUN: ${{ inputs.force }}
          TARGET_DATE: ${{ steps.usage-date.outputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            daily-radar collect --kind publish --date "$TARGET_DATE"
          elif [ "$FORCE_RUN" = "true" ]; then
            daily-radar collect --kind all
          else
            daily-radar collect --kind publish
          fi

      - name: Save same-day radar state, including failed-call usage
        if: ${{ always() && steps.daily-guard.outputs.should_run == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: data/daily_radar.db
          key: >-
            daily-radar-state-${{ runner.os }}-${{ steps.usage-date.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build static site
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          TARGET_DATE: ${{ steps.usage-date.outputs.target_date }}
        run: daily-radar build-site --output site --site-url "$SITE_URL/" --date "$TARGET_DATE"

      - name: Validate publish artifact
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        env:
          TARGET_DATE: ${{ steps.usage-date.outputs.target_date }}
        run: |
          test -s site/index.html
          test -s site/data/latest.json
          test -s site/daily.md
          test -s site/feed.xml
          test -s site/assets/pages.css
          test -s site/assets/pages.js
          if [ -n "$TARGET_DATE" ]; then
            test -s "site/archive/$TARGET_DATE/index.html"
            test -s "site/archive/$TARGET_DATE/data/latest.json"
            test -s site/archive/index.json
          fi

      - name: Upload GitHub Pages artifact
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Send daily email
        if: >-
          steps.daily-guard.outputs.should_run == 'true' &&
          steps.execution-phase.outputs.value == 'publish'
        env:
          DAILY_RADAR_EMAIL_USERNAME: ${{ secrets.DAILY_RADAR_EMAIL_USERNAME }}
          DAILY_RADAR_EMAIL_AUTH_CODE: ${{ secrets.DAILY_RADAR_EMAIL_AUTH_CODE }}
          TARGET_DATE: ${{ steps.usage-date.outputs.target_date }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$DAILY_RADAR_EMAIL_USERNAME" ] || [ -z "$DAILY_RADAR_EMAIL_AUTH_CODE" ]; then
            echo "::error::Configure DAILY_RADAR_EMAIL_USERNAME and DAILY_RADAR_EMAIL_AUTH_CODE before enabling daily delivery."
            exit 1
          fi
          daily-radar send-email --site-url "$SITE_URL/" --date "$TARGET_DATE"

  deploy:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.should_run == 'true' &&
      needs.build.outputs.phase == 'publish'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  mark-success:
    needs: [build, deploy]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.deploy.result == 'success' &&
      needs.build.outputs.should_run == 'true' &&
      needs.build.outputs.phase == 'publish' &&
      needs.build.outputs.success_marker_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create successful-delivery receipt
        shell: bash
        run: |
          mkdir -p .daily-success
          echo "local_date=${{ needs.build.outputs.local_date }}" > .daily-success/receipt.txt
          echo "workflow_run=${{ github.run_id }}" >> .daily-success/receipt.txt
          echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .daily-success/receipt.txt

      - name: Save today's successful-delivery marker
        uses: actions/cache/save@v5
        with:
          path: .daily-success
          key: daily-radar-success-${{ runner.os }}-${{ needs.build.outputs.local_date }}
