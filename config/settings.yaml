app:
  database_path: data/daily_radar.db
  output_dir: outputs
  timezone: Asia/Shanghai
  sources_path: config/sources.yaml

news:
  # 新闻不限自动驾驶/多模态，但必须是具体的 AI 发布或技术成果事件。
  lookback_hours: 48
  max_important: 15
  cluster_similarity: 0.72

papers:
  # 用于采集回补和“近 4 日”视图；Dashboard 与每日导出默认仍只显示北京时间当天。
  lookback_hours: 96
  max_results: 150
  max_important: 20
  categories:
    - cs.CV
    - cs.RO
    - cs.AI
    - cs.LG
    - cs.CL

network:
  timeout_seconds: 25
  retries: 2
  retry_backoff_seconds: 1.0
  # arXiv asks clients to identify themselves. Replace the placeholder before
  # scheduling this project on a public server.
  user_agent: "DailyAIRadar/0.5.0 (contact: replace-with-your-email@example.com)"

llm:
  # DeepSeek 是语义入选的唯一裁判；没有 Key 或调用失败时任务会停止，
  # 不会静默退回关键词评分并发布低可信结果。
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key: ""
  model: deepseek-v4-pro
  thinking_enabled: true
  reasoning_effort: max
  timeout_seconds: 180
  max_output_tokens: 8192
  news_batch_size: 20
  paper_batch_size: 12
  max_retries: 1
  daily_token_limit: 250000
  daily_cost_limit_usd: 1.00
  prompt_version: 2026-08-29-v1
  system_prompt_path: prompts/system.md
  news_prompt_path: prompts/news_screening.md
  paper_prompt_path: prompts/paper_screening.md

email:
  # 邮箱地址和 163 SMTP 授权码只从 GitHub Secrets / 环境变量读取。
  smtp_host: smtp.163.com
  smtp_port: 465
  from_name: Daily AI Radar
