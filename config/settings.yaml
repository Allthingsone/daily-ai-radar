app:
  database_path: data/daily_radar.db
  output_dir: outputs
  timezone: Asia/Shanghai
  sources_path: config/sources.yaml

news:
  # 新闻不限自动驾驶/多模态，但必须是具体的 AI 发布或技术成果事件。
  lookback_hours: 48
  min_relevance: 8.0
  min_score: 40.0
  max_important: 15
  cluster_similarity: 0.72
  personal_keywords:
    - multimodal
    - vision-language
    - agent
    - autonomous driving
    - open source

papers:
  # 用于采集回补和“近 4 日”视图；Dashboard 与每日导出默认仍只显示北京时间当天。
  lookback_hours: 96
  max_results: 150
  min_score: 42.0
  max_important: 20
  categories:
    - cs.CV
    - cs.RO
    - cs.AI
    - cs.LG
    - cs.CL
  personal_keywords:
    - vision-language-action
    - end-to-end autonomous driving
    - driving agent
    - world model
    - closed-loop

network:
  timeout_seconds: 25
  retries: 2
  retry_backoff_seconds: 1.0
  # arXiv asks clients to identify themselves. Replace the placeholder before
  # scheduling this project on a public server.
  user_agent: "DailyAIRadar/0.4.0 (contact: replace-with-your-email@example.com)"

llm:
  enabled: false
  base_url: https://api.openai.com/v1
  api_key: ""
  model: ""
  timeout_seconds: 45
