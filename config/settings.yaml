app:
  database_path: data/daily_radar.db
  output_dir: outputs
  timezone: Asia/Shanghai
  sources_path: config/sources.yaml

news:
  # 新闻不限方向，但模型只收重大基座模型，数据集/Benchmark 只收自动驾驶，
  # 科研成果必须同时重要且有可验证社区热度；另收录高价值社区热议。
  lookback_hours: 48
  max_important: 15
  cluster_similarity: 0.72

papers:
  # 抓取北京时间当天对应的最新 arXiv 公告批次。page_size 只控制单次 API
  # 请求大小；采集器会遵守 arXiv 建议的间隔并自动翻页到结果末尾。
  lookback_hours: 96
  page_size: 200
  page_delay_seconds: 3.0
  max_important: 20
  categories:
    - cs.CV
    - cs.RO
    - cs.AI
    - cs.LG
    - cs.CL
    - cs.SY
    - eess.SY
    - eess.IV
    - stat.ML

network:
  timeout_seconds: 25
  retries: 2
  retry_backoff_seconds: 1.0
  # arXiv asks clients to identify themselves. Replace the placeholder before
  # scheduling this project on a public server.
  user_agent: "DailyAIRadar/0.7.0 (contact: replace-with-your-email@example.com)"

llm:
  # DeepSeek 是语义入选的唯一裁判；没有 Key 或调用失败时任务会停止，
  # 不会静默退回关键词评分并发布低可信结果。
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key: ""
  model: deepseek-v4-pro
  thinking_enabled: true
  reasoning_effort: max
  # V4-Pro max 思考会与最终 JSON 共用输出额度。较大的上限避免推理完成前截断；
  # 程序仍受下面的每日 Token / 费用硬上限约束，并会自动拆分截断批次。
  timeout_seconds: 600
  max_output_tokens: 32768
  news_batch_size: 8
  paper_batch_size: 6
  # 当天论文先全部由同一个 V4-Pro 做非思考、高召回初筛，只传标题和摘要
  # 开头以控制 Token；入围项再用下面的 Thinking max 完整 Prompt 严格复筛。
  paper_triage_batch_size: 80
  paper_triage_abstract_chars: 480
  paper_triage_max_output_tokens: 8192
  max_retries: 1
  daily_token_limit: 250000
  daily_cost_limit_usd: 1.00
  prompt_version: 2026-08-31-v3
  system_prompt_path: prompts/system.md
  news_prompt_path: prompts/news_screening.md
  paper_triage_prompt_path: prompts/paper_triage.md
  paper_prompt_path: prompts/paper_screening.md

email:
  # 邮箱地址和 163 SMTP 授权码只从 GitHub Secrets / 环境变量读取。
  smtp_host: smtp.163.com
  smtp_port: 465
  from_name: Daily AI Radar
