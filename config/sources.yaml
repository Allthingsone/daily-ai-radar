# Source tiers: 1 = official/primary, 2 = established editorial source,
# 3 = community/discovery signal. A failed feed never stops the whole run.
sources:
  - id: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    tier: 1
    type: official
    focus: 1.0
    allowed_domains: [openai.com]
    tags: [model-release, research, product]

  - id: anthropic-news
    name: Anthropic News
    url: https://www.anthropic.com/rss.xml
    tier: 1
    type: official
    focus: 1.0
    # Anthropic currently has no official RSS endpoint. Keep the candidate in
    # configuration so a future sitemap adapter can restore it without using
    # an unaudited third-party feed.
    enabled: false
    allowed_domains: [anthropic.com]
    tags: [model-release, research, safety]

  - id: deepmind-blog
    name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    tier: 1
    type: official
    focus: 1.0
    allowed_domains: [deepmind.google]
    tags: [research, model-release]

  - id: google-ai
    name: Google AI
    url: https://blog.google/technology/ai/rss/
    tier: 1
    type: official
    focus: 0.95
    allowed_domains: [blog.google, google.com]
    tags: [product, research, industry]

  - id: microsoft-research
    name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    tier: 1
    type: official
    focus: 0.85
    allowed_domains: [microsoft.com]
    tags: [research]

  - id: nvidia-ai
    name: NVIDIA AI Blog
    url: https://blogs.nvidia.com/blog/category/deep-learning/feed/
    tier: 1
    type: official
    focus: 0.9
    allowed_domains: [nvidia.com]
    tags: [research, hardware, autonomous-driving]

  - id: huggingface-blog
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    tier: 1
    type: official
    focus: 1.0
    allowed_domains: [huggingface.co]
    tags: [open-source, research, model-release]

  - id: github-ai
    name: GitHub AI & ML
    url: https://github.blog/ai-and-ml/feed/
    tier: 1
    type: official
    focus: 0.9
    allowed_domains: [github.blog, github.com]
    tags: [developer-tools, agents, open-source]

  - id: aws-ml
    name: AWS Machine Learning Blog
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    tier: 1
    type: official
    focus: 0.85
    allowed_domains: [aws.amazon.com, amazon.com]
    tags: [engineering, product]

  - id: techcrunch-ai
    name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    tier: 2
    type: media
    focus: 0.9
    allowed_domains: [techcrunch.com]
    tags: [industry, product]

  - id: the-decoder
    name: The Decoder
    url: https://the-decoder.com/feed/
    tier: 2
    type: media
    focus: 0.95
    allowed_domains: [the-decoder.com]
    tags: [model-release, industry, research]

  - id: venturebeat-ai
    name: VentureBeat AI
    # The category feed currently returns HTTP 308 to Python 3.9 clients; the
    # canonical main feed is stable and downstream AI relevance rules remove
    # unrelated stories.
    url: https://venturebeat.com/feed/
    tier: 2
    type: media
    focus: 0.75
    allowed_domains: [venturebeat.com]
    tags: [industry, enterprise]

  - id: hacker-news-top
    name: Hacker News · Top discussions
    url: https://hacker-news.firebaseio.com/v0/topstories.json
    tier: 3
    type: community
    adapter: hackernews
    focus: 0.6
    max_items: 30
    community_platform: Hacker News
    community_rank_limit: 30
    # A story is a verified heat signal when it is in the current Top 30 and
    # has either 100 points or 30 comments. These values are sent to DeepSeek;
    # the model is never asked to guess popularity from headline wording.
    community_min_points: 100
    community_min_comments: 30
    allowed_domains: [hacker-news.firebaseio.com, news.ycombinator.com]
    allow_external_links: true
    tags: [community, discussion, overseas]

  - id: csdn-hot
    name: CSDN · 实时热榜
    enabled: false
    url: "https://blog.csdn.net/phoenix/web/blog/hot-rank?page=0&pageSize=20&type="
    tier: 3
    type: community
    adapter: csdn-hot
    focus: 0.65
    max_items: 20
    community_platform: CSDN
    community_rank_limit: 20
    # Kept as an implemented optional adapter, but disabled by default: CSDN's
    # article pages currently return HTTP 521 to CI-style automated requests,
    # so the collector cannot reliably verify the real publication timestamp.
    community_min_points: 1000
    community_min_comments: 10
    allowed_domains: [blog.csdn.net]
    tags: [community, discussion, china]

  - id: juejin-ai-hot
    name: 掘金 · 人工智能热榜
    url: "https://api.juejin.cn/content_api/v1/content/article_rank?category_id=6809637773935378440&type=hot"
    tier: 3
    type: community
    adapter: juejin-hot
    focus: 0.7
    max_items: 20
    community_platform: 掘金
    community_rank_limit: 20
    # The list supplies hot rank and interaction counters. The collector also
    # reads Schema.org datePublished from each article; it never uses run time
    # as a substitute for an article's publication date.
    community_min_points: 300
    community_min_comments: 10
    allowed_domains: [api.juejin.cn, juejin.cn]
    tags: [community, discussion, china, ai]

  - id: transformers-releases
    name: Transformers Releases
    url: https://github.com/huggingface/transformers/releases.atom
    tier: 1
    type: github-release
    focus: 1.0
    allowed_domains: [github.com]
    tags: [open-source, developer-tools]

  - id: vllm-releases
    name: vLLM Releases
    url: https://github.com/vllm-project/vllm/releases.atom
    tier: 1
    type: github-release
    focus: 0.95
    allowed_domains: [github.com]
    tags: [open-source, inference]

  - id: openai-python-releases
    name: OpenAI Python Releases
    url: https://github.com/openai/openai-python/releases.atom
    tier: 1
    type: github-release
    focus: 0.85
    allowed_domains: [github.com]
    tags: [developer-tools, release]
